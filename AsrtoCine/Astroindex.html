<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AlienStore - Films TMDB</title>
<link rel="stylesheet" href="Astrostyle.css">
</head>
<body>
<header>
    <nav>
        <a href="#elemt" class="logo">
            <img src="image/logo.jpeg" alt="Logo de l'entreprise" height="100">
        </a>
        <ul>
            <li><a href="#elemt">Home</a></li>
            <li><a href="#movies-container" id="products-link">Products</a></li>
            <li><button type="button" id="favorites-nav" class="nav-favorites-btn">Favoris</button></li>
            <li><a href="#foot">Contact</a></li>
           </ul>
    </nav>
</header>
<section  class="hero">
    <div id="elemt">
        <p class="elemt-text">Faites vos achats à la manière d'un extra-terrestre sans bouger pour recevoir vos produits.</p>
        <a href="#movies-container" class="elemt-button">Voir la collection</a>
    </div>
            
</section>
<h1>Films Populaires</h1>

<div class="search-wrap">
    <input type="search" id="movie-search" class="search-bar" placeholder="Rechercher un film..." aria-label="Rechercher un film">
</div>

<div id="movies-container" class="movies-grid"></div>

<section id="favorites-section" class="favorites-section">
    <h2>Mes films favoris</h2>
    <div id="favorites-container" class="favorites-grid"></div>
</section>

<div id="movie-modal" class="modal hidden" aria-hidden="true">
    <div class="modal-backdrop" data-close="true"></div>
    <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <button type="button" class="modal-close" aria-label="Fermer la modale">×</button>
        <div id="modal-body"></div>
    </div>
</div>

<footer>
        <div id="foot" class="foot">
            @copyright AkieniAcademy||MOUYEDI Salem
        </div>
    </footer>
<script src="function.js"></script>
</body>
</html>
